<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warhammer Combat Simulator</title>
</head>

<body>

<h1>Warhammer Combat Simulator</h1>

<h2>Battle Setup</h2>

<label for="attacker">Attacker:</label>
<select id="attacker"></select>

<br><br>

<label for="defender">Defender:</label>
<select id="defender"></select>

<br><br>

<label for="runs">Simulations:</label>
<input id="runs" type="number" value="1000">

<br><br>

<label for="distance">Starting Distance:</label>
<input id="distance" type="number" value="14">

<br><br>

<label for="attackerCharge">Attacker wants to charge:</label>
<input id="attackerCharge" type="checkbox">

<br><br>

<label for="defenderCharge">Defender wants to charge:</label>
<input id="defenderCharge" type="checkbox">

<br><br>

<button>Simulate</button>

</body>
</html>
<script src="app.js"></script>
